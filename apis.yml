aid: 3d-look
name: 3D Look
description: >-
  3DLOOK is an AI-powered body measurement and mobile body-scanning company whose
  computer-vision technology extracts 80+ accurate body measurements and 3D body
  models from just two smartphone photos. It offers two developer products: SAIA
  Perfect Fit / Mobile Tailor (a made-to-measure and size-recommendation API for
  apparel, uniforms, and on-demand manufacturing) and FitXpress (a body-composition
  and health/fitness insights API delivering weight prediction, BMI, body-fat, BMR,
  and 2D/3D body-progress visualization). Both expose REST APIs with API-key
  authentication, a JavaScript SDK, native iOS and Android capture SDKs, and
  embeddable photo-capture and measurement widgets.
